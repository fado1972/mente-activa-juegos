# Configuración de nginx para servir "Mente Activa" en tu lab local (WSL2).
# Escucha en el 80 pero SOLO responde a server_name "mente-activa-wsl.local",
# así que no interfiere con otros sites que añadas más adelante en el mismo
# nginx (cada proyecto, su propio server_name, todos compartiendo el 80).

server {
    listen 80;
    listen [::]:80;
    server_name mente-activa-wsl.local;

    root /var/www/juegos;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS y JS: deploy.sh añade "?v=<timestamp>" a cada referencia local
    # en el HTML en cada despliegue, así que una URL vieja en caché deja
    # de usarse en cuanto publicas cambios. Con eso ya es seguro cachear
    # mucho tiempo en el navegador.
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # El favicon cambia poco; cache más larga también.
    location ~* \.(svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # text/html no se declara aquí: nginx ya lo comprime siempre,
    # declararlo de nuevo genera un warning de "duplicate MIME type".
    gzip on;
    gzip_types text/css application/javascript;

    access_log /var/log/nginx/juegos.access.log;
    error_log /var/log/nginx/juegos.error.log;
}
